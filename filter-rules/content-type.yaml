version: 1
default: accept

# Optional; CLI --model / --mmproj override these when set.
model: unsloth/Qwen3-VL-4B-Instruct-BF16
mmproj: /Users/sylvia/Repos/photo-library-repair/unsloth/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf

rules:
  - name: content-type
    match: { format: [jpeg, png, heic, webp] }   # optional pre-filter, saves model calls
    action: classify
    classify:
      # model / mmproj may also be set here (must not conflict with top-level).
      # dest = {library}/{label}/{relpath}
      # "none" / unknown label → leave in place (no confidence gate yet)
      prompt: |
        You are sorting images within a library. Classify image as whole, dont focus on small details.
        Answer with exactly one label from the list or "none" if no label fits.
        
      categories:
        email: "image shows an email message"
        screenshot: "image shows a screenshot of a computer screen"
        phone-screenshot: "image shows a screenshot of a phone screen"
        book-page: "image shows a photo of a book page"
        document: "image shows a scanned or photographed document"
        handwriting: "image shows handwritten notes"
        logo: "image shows a logo or application asset"
        product: "image shows a product image with background removed"
